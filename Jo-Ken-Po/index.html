<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Pedra, papel e tesoura</title>
</head>
<body>
    
    
    <div class="container">
        <div class="score">
            <p>Computador : 
                <span id="computer_score">0</span>
            </p>
            <p>Você :
                <span id="user_score">0</span>
            </p>
        </div>
        <div class="arena">
            <div class="hand user-hand">
                <i class="fas fa-hand-rock"></i>
            </div>
            <div class="hand computer-hand">
                <i class="fas fa-hand-rock"></i>
            </div>
        </div>
        <div class="weapons">
            <button id="pedra" aria-label="Pedra">
                <i class="far fa-hand-rock"></i>
            </button>
            <button id="papel" aria-label="Papel">
                <i class="far fa-hand-paper"></i>
            </button>
            <button id="tesoura" aria-label="Tesoura">
                <i class="far fa-hand-scissors"></i>
            </button>
        </div>        
        <div class="details">
            <p id="user_choice"></p>
            <p id="comp_choice"></p>
            <p id="result"></p>
        </div>
    </div>   
        
    
    <script src="./assets/js/script.js"></script> 
</body>
</html>
